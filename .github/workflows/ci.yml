name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  # Next.js build + TypeScript check
  vercel-build:
    name: Next.js Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Next.js build
        run: npm run build
        env:
          # Dummy values so the build doesn't fail on missing env vars
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DASHBOARD_TOKEN: "ci-dummy"

  # Worker Python tests
  worker-tests:
    name: Worker Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: python -m pytest -v --tb=short
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          ARQ_REDIS_URL: "redis://localhost:6379"
          UPSTASH_REDIS_REST_URL: "https://dummy.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "dummy"
